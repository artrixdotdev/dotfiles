"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$cmd_duration  $directory
$character
"""

palette = "colors"

right_format = """
$singularity\
$kubernetes\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time"""

[fill]
symbol = ' '

[palettes.colors]
primary_fixed = '{{colors.primary_fixed.default.hex}}'
on_primary_fixed = '{{colors.on_primary_fixed.default.hex}}'
primary_fixed_dim = '{{colors.primary_fixed_dim.default.hex}}'
secondary_fixed = '{{colors.secondary_fixed.default.hex}}'
on_secondary_fixed = '{{colors.on_secondary_fixed.default.hex}}'
secondary_fixed_dim = '{{colors.secondary_fixed_dim.default.hex}}'
tertiary_fixed = '{{colors.tertiary_fixed.default.hex}}'
on_tertiary_fixed = '{{colors.on_tertiary_fixed.default.hex}}'
tertiary_fixed_dim = '{{colors.tertiary_fixed_dim.default.hex}}'
error = '{{colors.error.default.hex}}'
on_error = '{{colors.on_error.default.hex}}'
on_surface = '{{colors.on_surface.default.hex}}'
outline = '{{colors.outline.default.hex}}'
surface_container_highest = '{{colors.surface_container_highest.default.hex}}'
primary = '{{colors.primary.default.hex}}'
secondary = '{{colors.secondary.default.hex}}'
tertiary = '{{colors.tertiary.default.hex}}'

[character]
success_symbol = "[  ](bold fg:primary)"
error_symbol = "[  ](bold fg:error)"

[package]
disabled = false

[git_branch]
style = "bg:primary_fixed fg:on_primary_fixed"
symbol = "󰘬"

ignore_branches = ["main", "master"]
truncation_length = 12
truncation_symbol = ""
format = "[](bold fg:primary_fixed)[$symbol $branch(:$remote_branch)]($style)[](bold fg:primary_fixed)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "
style = "fg:primary_fixed_dim"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold fg:error)"

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic dimmed fg:tertiary_fixed'
deleted_style = 'italic dimmed fg:error'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic fg:primary_fixed"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic fg:error)"
ahead = "[▴│[${count}](bold fg:on_surface)│](italic fg:tertiary_fixed)"
behind = "[▿│[${count}](bold fg:on_surface)│](italic fg:error)"
diverged = "[◇ ▴┤[${ahead_count}](regular fg:on_surface)│▿┤[${behind_count}](regular fg:on_surface)│](italic fg:error)"
untracked = "[◌◦](italic fg:secondary_fixed)"
stashed = "[◃◈](italic fg:outline)"
modified = "[●◦](italic fg:tertiary_fixed)"
staged = "[▪┤[$count](bold fg:on_surface)│](italic fg:primary_fixed)"
renamed = "[◎◦](italic fg:secondary_fixed_dim)"
deleted = "[✕](italic fg:error)"

[directory]
home_symbol = ""
read_only = ""
style = "bg:tertiary_fixed_dim fg:on_tertiary_fixed"
truncation_length = 6
format = '[](bold fg:tertiary_fixed_dim)[$path]($style)[](bold fg:tertiary_fixed_dim)'

[cmd_duration]
min_time = 0
format = '[](bold fg:tertiary_fixed)[󰔶 $duration](bold bg:tertiary_fixed fg:on_tertiary_fixed)[](bold fg:tertiary_fixed)'
